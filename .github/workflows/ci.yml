name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements.txt -r requirements/requirements-pdf.txt -r requirements/requirements-dictionary.txt httpx pytest
      # The dictionary tests need the English spaCy pipeline and Open English WordNet.
      - name: Cache dictionary data
        uses: actions/cache@v4
        with:
          path: ~/.wn_data
          key: wn-oewn-2024
      - name: Download dictionary data
        run: |
          python -m spacy download en_core_web_sm
          python -c "import wn; any(l.id == 'oewn' for l in wn.lexicons()) or wn.download('oewn:2024')"
      - name: Check version consistency
        run: python scripts/check_version.py
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec tsc -b
